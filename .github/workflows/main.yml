دقيقة واحدة دقيقة أفحصها لك. تفضل، هذا الكود. انسخه كامل والصقه كما هو داخل المربع.

name: Build Sayanati APK on: workflow_dispatch push: branches: - main jobs: build: runs-on: ubuntu-latest steps: - name: Checkout uses: actions/checkout@v4 - name: Set up Java 17 uses: actions/setup-java@v4 with: distribution: temurin java-version: '17' - name: Set up Android SDK uses: android-actions/setup-android@v3

name: Install Android SDK run: |- yes | sdkmanager --licenses > /dev/null || true sdkmanager "platforms;android-35" "build-tools;35.0.0" - name: Unzip Sayanati project shell: bash run: |- mkdir -p project

ZIP=$(find . -maxdepth 1 -type f -name 'Sayanati_APK_ready_project*.zip' -print -quit) if; then echo "Project ZIP not found" exit 1 fi unzip -q "$ZIP" -d project ROOT=$(find project -type f -name settings.gradle.kts -print -quit) if; then echo "settings.gradle.kts not found" exit 1 fi ROOT=$(dirname "$ROOT") echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV" - name: Set up Gradle uses: gradle/actions/setup-gradle@v4 with: gradle-version: '8.9' - name: Build APK run: gradle -p "$PROJECT assembleDebug - name: Upload APK uses: actions/upload-artifact@v4 with: name: sayanati-debug-apk path: ${{PROJECT_ROOT}}/app/build/outputs/apk/debug/app-debug.apk
